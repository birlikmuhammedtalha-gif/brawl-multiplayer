<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brawl Arena Multiplayer</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;font-family:Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;overflow:hidden;}
#root{width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center;padding:8px 0;}
#lobby{width:100%;display:none;flex-direction:column;align-items:center;padding:20px 16px;gap:10px;}
#authScreen{width:100%;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:10px;}
#authError{color:#e74c3c;font-size:12px;text-align:center;min-height:14px;}
#userBar{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;margin-bottom:2px;}
#userBar b{color:#f5a623;}
#streakBadge{color:#ff9800;font-weight:bold;}
#lobby h1{color:#f5a623;font-size:24px;}
#lobby p{color:#888;font-size:12px;}
.section{background:#2d3250;border-radius:10px;padding:14px;width:100%;max-width:320px;}
.section h3{color:#fff;font-size:12px;margin-bottom:8px;}
input,select{width:100%;padding:8px 12px;border-radius:6px;border:1px solid #444;background:#1a1a2e;color:#fff;font-size:13px;margin-bottom:8px;}
.btn{width:100%;padding:11px;border-radius:8px;border:none;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:6px;touch-action:manipulation;}
.btn-orange{background:#f5a623;color:#000;}
.btn-purple{background:#7c3aed;color:#fff;}
#status{color:#4caf50;font-size:12px;text-align:center;}
#playerList{color:#aaa;font-size:12px;line-height:1.9;}
#matchStatus{text-align:center;padding:10px;color:#f5a623;font-size:13px;}
.spinner{display:inline-block;width:16px;height:16px;border:3px solid #444;border-top-color:#f5a623;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
.divider{width:100%;max-width:320px;text-align:center;color:#555;font-size:11px;margin:2px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#444;}
.divider::before{left:0;}.divider::after{right:0;}
#gameArea{display:none;flex-direction:column;align-items:center;width:100%;position:relative;}
#myTeamBadge{font-size:12px;font-weight:bold;text-align:center;margin-bottom:3px;}
#hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;margin-bottom:4px;color:#fff;font-size:11px;padding:0 4px;}
.thud{display:flex;flex-direction:column;gap:2px;}
.mbars{display:flex;flex-direction:column;gap:2px;}
.mbar-row{display:flex;align-items:center;gap:3px;}
.bar-bg{width:55px;height:5px;background:#333;border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width 0.1s;}
#scoreboard{text-align:center;color:#f5a623;font-size:16px;font-weight:bold;}
#gameCanvas{border:2px solid #444;border-radius:8px;display:block;touch-action:none;}
#mobileControls{display:none;width:100%;max-width:600px;padding:8px 4px;position:relative;height:130px;}
#joystickZone{position:absolute;left:10px;bottom:10px;width:110px;height:110px;}
#joystickBase{width:110px;height:110px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);border-radius:50%;position:absolute;}
#joystickKnob{width:44px;height:44px;background:rgba(255,255,255,0.4);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
#fireBtn{position:absolute;right:10px;bottom:10px;width:80px;height:80px;background:rgba(231,76,60,0.7);border:2px solid rgba(231,76,60,0.9);border-radius:50%;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;user-select:none;}
#kickBtn{position:absolute;right:100px;bottom:10px;width:65px;height:65px;background:rgba(91,142,245,0.7);border:2px solid rgba(91,142,245,0.9);border-radius:50%;color:#fff;font-size:22px;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;user-select:none;display:none;}
#overlay{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.93);border-radius:12px;padding:18px 28px;text-align:center;color:#fff;z-index:10;min-width:200px;display:none;}
#overlay h2{font-size:19px;font-weight:bold;margin-bottom:5px;}
#overlay p{color:#aaa;font-size:11px;margin-bottom:12px;line-height:1.8;}
.obtn{background:#f5a623;color:#000;border:none;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:bold;cursor:pointer;margin:3px;touch-action:manipulation;}
#waitingSection{display:none;}
</style>
</head>
<body>
<div id="root">
  <div id="authScreen">
    <h1>⚡ Brawl Arena</h1>
    <p>Devam etmek için giriş yap veya kayıt ol</p>
    <div class="section">
      <h3>👤 Hesap</h3>
      <input id="authUsername" placeholder="Kullanıcı adı" maxlength="16"/>
      <input id="authPassword" type="password" placeholder="Şifre (en az 4 hane)" maxlength="32"/>
      <button class="btn btn-orange" onclick="doLogin()">Giriş Yap</button>
      <button class="btn btn-purple" onclick="doRegister()">Kayıt Ol</button>
      <div id="authError"></div>
    </div>
  </div>
  <div id="lobby">
    <h1>⚡ Brawl Arena</h1>
    <div id="userBar">👤 <b id="userLabel"></b> &nbsp; 🏆 <b id="userTrophies">0</b> &nbsp; <span id="streakBadge" style="display:none;">🔥 <b id="userStreak">0</b> seri</span></div>
    <p>Arkadaşınla veya rastgele biriyle oyna!</p>
    <div class="section">
      <h3>🎮 Oyun Modu</h3>
      <select id="modeSelect">
        <option value="arena">⚔️ Arena</option>
        <option value="soccer">⚽ Futbol</option>
      </select>
    </div>
    <div class="section">
      <h3>🎲 Rastgele Eşleşme</h3>
      <div id="matchStatus" style="display:none;"></div>
      <button class="btn btn-purple" id="randomBtn" onclick="findMatch()">🎲 Rastgele Oyun Bul</button>
    </div>
    <div class="divider">veya</div>
    <div class="section">
      <h3>🚪 Arkadaşınla Oyna</h3>
      <input id="roomInput" placeholder="Oda kodu (örn: oda123)" maxlength="20"/>
      <button class="btn btn-orange" onclick="joinRoom()">Odaya Katıl / Oluştur</button>
    </div>
    <div id="status"></div>
    <div class="section" id="waitingSection">
      <h3>👥 Odadaki Oyuncular</h3>
      <div id="playerList"></div>
      <br>
      <button class="btn btn-orange" id="startBtn" onclick="startGame()" style="display:none;">▶ Oyunu Başlat</button>
      <p style="color:#888;font-size:11px;margin-top:6px;" id="waitingMsg">Diğer oyuncuları bekliyor...</p>
    </div>
  </div>
  <div id="gameArea">
    <div id="myTeamBadge"></div>
    <div id="hud">
      <div class="thud"><span style="font-size:12px;font-weight:bold;color:#5b8ef5">🔵 Mavi</span><div class="mbars" id="bluebars"></div></div>
      <div id="scoreboard">0 — 0</div>
      <div class="thud" style="align-items:flex-end"><span style="font-size:12px;font-weight:bold;color:#e74c3c">🔴 Kırmızı</span><div class="mbars" id="redbars"></div></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="mobileControls">
      <div id="joystickZone"><div id="joystickBase"></div><div id="joystickKnob"></div></div>
      <div id="fireBtn">🔥</div>
      <div id="kickBtn">⚽</div>
    </div>
    <div id="overlay">
      <h2 id="ovTitle"></h2><p id="ovDesc"></p><p id="ovTrophyLine" style="color:#f5a623;font-weight:bold;"></p><div id="ovBtns"></div>
    </div>
  </div>
</div>
<script>
const socket=io();
let myUsername=null,myTrophies=0,myStreak=0;
const savedUsername=localStorage.getItem('brawlUsername');
if(savedUsername)document.getElementById('authUsername').value=savedUsername;

function renderStreak(){
  const badge=document.getElementById('streakBadge');
  if(myStreak>0){badge.style.display='inline';document.getElementById('userStreak').textContent=myStreak;}
  else badge.style.display='none';
}

function doRegister(){
  const u=document.getElementById('authUsername').value.trim();
  const p=document.getElementById('authPassword').value;
  document.getElementById('authError').textContent='';
  socket.emit('register',{username:u,password:p});
}
function doLogin(){
  const u=document.getElementById('authUsername').value.trim();
  const p=document.getElementById('authPassword').value;
  document.getElementById('authError').textContent='';
  socket.emit('login',{username:u,password:p});
}
socket.on('authSuccess',({username,trophies,streak})=>{
  myUsername=username;myTrophies=trophies;myStreak=streak||0;
  localStorage.setItem('brawlUsername',username);
  document.getElementById('authScreen').style.display='none';
  document.getElementById('lobby').style.display='flex';
  document.getElementById('userLabel').textContent=username;
  document.getElementById('userTrophies').textContent=trophies;
  renderStreak();
});
socket.on('authError',({message})=>{
  document.getElementById('authError').textContent=message;
});
let lastMatchDelta=null;
socket.on('trophyUpdate',({trophies,delta,streak,won})=>{
  myTrophies=trophies;myStreak=streak||0;
  document.getElementById('userTrophies').textContent=trophies;
  renderStreak();
  lastMatchDelta={delta,streak,won};
  updateOverlayTrophyLine();
});

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const GW=600,GH=420;
let scale=1;

function resizeCanvas(){
  const maxW=Math.min(window.innerWidth-8,600);
  scale=maxW/GW;
  canvas.width=GW;canvas.height=GH;
  canvas.style.width=maxW+'px';
  canvas.style.height=(GH*scale)+'px';
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

let myId=null,myTeam=null,myMode='arena';
let players={},ball=null,bullets=[],particles=[];
let keys={},score={blue:0,red:0};
let goalFlash=0,goalText='';
let ammo=5,reloadTimer=0,shootCooldown=0,kickCooldown=0;
let searching=false,isMobile=false;

const GOAL_H=110,GOAL_TOP=(GH-GOAL_H)/2,GOAL_BOT=(GH+GOAL_H)/2,GOAL_W=20;
const TEAM_COLORS={blue:'#5b8ef5',red:'#e74c3c'};

const ARENA_WALLS=[
  [5,1],[9,1],[5,8],[9,8],
  [2,3],[2,7],[12,3],[12,7],
  [6,4],[8,4],[6,6],[8,6]
].map(([x,y])=>({x:x*40,y:y*40,w:40,h:40}));

function rectHit(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function wallHit(x,y,r){
  const walls=myMode==='soccer'?[]:ARENA_WALLS;
  for(let w of walls)if(rectHit(x-r,y-r,r*2,r*2,w.x,w.y,w.w,w.h))return true;
  return false;
}
function tryMoveLocal(obj,dx,dy){
  const nx=Math.max(obj.r+1,Math.min(GW-obj.r-1,obj.x+dx));
  const ny=Math.max(obj.r+1,Math.min(GH-obj.r-1,obj.y+dy));
  if(!wallHit(nx,obj.y,obj.r))obj.x=nx;
  if(!wallHit(obj.x,ny,obj.r))obj.y=ny;
}

// Joystick
let joystickDx=0,joystickDy=0,fireBtnDown=false,kickBtnDown=false;
const jZone=document.getElementById('joystickZone');
const jKnob=document.getElementById('joystickKnob');
const jBase=document.getElementById('joystickBase');
const JRADIUS=33;
function getJPos(e){
  const rect=jBase.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const t=e.touches?e.touches[0]:e;
  let dx=t.clientX-cx,dy=t.clientY-cy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>JRADIUS){dx=dx/dist*JRADIUS;dy=dy/dist*JRADIUS;}
  return{dx,dy};
}
jZone.addEventListener('touchstart',e=>{e.preventDefault();const{dx,dy}=getJPos(e);joystickDx=dx/JRADIUS;joystickDy=dy/JRADIUS;jKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;},{passive:false});
jZone.addEventListener('touchmove',e=>{e.preventDefault();const{dx,dy}=getJPos(e);joystickDx=dx/JRADIUS;joystickDy=dy/JRADIUS;jKnob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;},{passive:false});
jZone.addEventListener('touchend',e=>{e.preventDefault();joystickDx=0;joystickDy=0;jKnob.style.transform='translate(-50%,-50%)';},{passive:false});
document.getElementById('fireBtn').addEventListener('touchstart',e=>{e.preventDefault();fireBtnDown=true;},{passive:false});
document.getElementById('fireBtn').addEventListener('touchend',e=>{e.preventDefault();fireBtnDown=false;},{passive:false});
document.getElementById('kickBtn').addEventListener('touchstart',e=>{e.preventDefault();kickBtnDown=true;},{passive:false});
document.getElementById('kickBtn').addEventListener('touchend',e=>{e.preventDefault();kickBtnDown=false;},{passive:false});

// SOCKET
socket.on('joinedRoom',({playerId,team})=>{
  myId=playerId;myTeam=team;
  document.getElementById('status').textContent=`✅ Takım: ${team==='blue'?'🔵 Mavi':'🔴 Kırmızı'}`;
  document.getElementById('waitingSection').style.display='block';
});
socket.on('waitingForMatch',({message})=>{
  searching=true;
  const ms=document.getElementById('matchStatus');ms.style.display='block';
  ms.innerHTML=`<span class="spinner"></span>${message}`;
  document.getElementById('randomBtn').textContent='❌ İptal';
  document.getElementById('randomBtn').onclick=cancelMatch;
});
socket.on('matchCancelled',()=>{
  searching=false;document.getElementById('matchStatus').style.display='none';
  document.getElementById('randomBtn').textContent='🎲 Rastgele Oyun Bul';
  document.getElementById('randomBtn').onclick=findMatch;
});
socket.on('roomUpdate',({players:pl,score:sc,mode,playerCount})=>{
  players=pl;score=sc;if(mode)myMode=mode;updateLobbyList();
  if(playerCount>=2){document.getElementById('startBtn').style.display='block';document.getElementById('waitingMsg').textContent='Hazır!';}
});
socket.on('gameStarted',({players:pl,ball:b,mode})=>{
  players=pl;ball=b;myMode=mode||'arena';searching=false;
  overlayIsFinal=false;lastMatchDelta=null;
  document.getElementById('lobby').style.display='none';
  document.getElementById('gameArea').style.display='flex';
  const badge=document.getElementById('myTeamBadge');
  badge.textContent=myTeam==='blue'?'🔵 Mavi Takım':'🔴 Kırmızı Takım';
  badge.style.color=myTeam==='blue'?'#5b8ef5':'#e74c3c';
  isMobile=/Android|iPhone|iPad|iPod|Touch/i.test(navigator.userAgent)||window.innerWidth<600;
  if(isMobile){
    document.getElementById('mobileControls').style.display='block';
    if(myMode==='soccer')document.getElementById('kickBtn').style.display='flex';
  }
  resizeCanvas();
  requestAnimationFrame(gameLoop);
});
socket.on('playerMoved',({id,x,y,angle,hp})=>{
  if(players[id]){
    players[id].x=x;players[id].y=y;players[id].angle=angle;
    if(hp!==undefined)players[id].hp=hp;
  }
});
socket.on('bulletFired',(data)=>{
  // Lokal görsel mermi — duvar kontrolü dahil
  bullets.push({...data,life:70,dead:false,r:5,local:false});
});
socket.on('playerDamaged',({id,hp})=>{
  if(players[id]){
    players[id].hp=hp;
    // Kısa yanıp sönme — sadece 6 frame (0.1 sn)
    players[id].hitFlash=6;
    spawnParts(players[id].x,players[id].y,TEAM_COLORS[players[id].team]||'#fff',6,3);
  }
});
socket.on('playerDied',({id})=>{
  if(players[id]){players[id].dead=true;players[id].hp=0;spawnParts(players[id].x,players[id].y,'#f5a623',16,5);}
});
socket.on('ballMoved',(b)=>{if(ball)Object.assign(ball,b);});
socket.on('goalScored',({team,score:sc})=>{
  score=sc;goalText=(team==='blue'?'🔵':'🔴')+' GOL!';goalFlash=130;
  spawnParts(GW/2,GH/2,TEAM_COLORS[team],25,7);
});
socket.on('roundReset',({players:pl,ball:b,score:sc})=>{players=pl;ball=b;score=sc;bullets=[];});
socket.on('newRound',({players:pl,score:sc,winner})=>{
  players=pl;score=sc;bullets=[];
  showOverlay((winner==='blue'?'🔵 Mavi':'🔴 Kırmızı')+' turu kazandı!','Skor: '+sc.blue+' — '+sc.red,false);
});
let overlayIsFinal=false;
socket.on('gameOver',({winner,score:sc})=>{
  overlayIsFinal=true;
  showOverlay('🏆 '+(winner==='blue'?'🔵 Mavi':'🔴 Kırmızı')+' Kazandı!','Skor: '+sc.blue+' — '+sc.red,true);
  document.getElementById('ovTrophyLine').textContent='Kupa hesaplanıyor...';
  updateOverlayTrophyLine();
});
function updateOverlayTrophyLine(){
  if(!overlayIsFinal||!lastMatchDelta)return;
  const {delta,streak,won}=lastMatchDelta;
  const sign=delta>=0?'+':'';
  let txt=(won?'🏆 ':'📉 ')+sign+delta+' Kupa';
  if(won&&streak>1)txt+='  •  🔥 '+streak+' maçlık seri!';
  document.getElementById('ovTrophyLine').textContent=txt;
}
socket.on('playerLeft',({id})=>{delete players[id];});
socket.on('roomFull',()=>alert('Oda dolu!'));

function findMatch(){if(searching)return;myMode=document.getElementById('modeSelect').value;socket.emit('findMatch',{mode:myMode});}
function cancelMatch(){socket.emit('cancelMatch');}
function joinRoom(){const r=document.getElementById('roomInput').value.trim();if(!r){alert('Oda kodu gir!');return;}myMode=document.getElementById('modeSelect').value;socket.emit('joinRoom',{roomId:r,mode:myMode});}
function startGame(){socket.emit('startGame');}
function updateLobbyList(){document.getElementById('playerList').innerHTML=Object.values(players).map(p=>`<span style="color:${p.team==='blue'?'#5b8ef5':'#e74c3c'}">${p.team==='blue'?'🔵':'🔴'} ${p.label} 🏆${p.trophies||0} ${p.id===myId?'(Sen)':''}</span>`).join('<br>');}
function spawnParts(x,y,color,n,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(0.4+Math.random());particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20,maxLife:20,color,r:2+Math.random()*3});}}

function updateMyPlayer(){
  const me=players[myId];if(!me||me.dead)return;
  let dx=0,dy=0,spd=2.5;
  if(isMobile&&(joystickDx||joystickDy)){dx=joystickDx*spd;dy=joystickDy*spd;}
  else{
    if(keys['w']||keys['arrowup'])dy=-spd;if(keys['s']||keys['arrowdown'])dy=spd;
    if(keys['a']||keys['arrowleft'])dx=-spd;if(keys['d']||keys['arrowright'])dx=spd;
    if(dx&&dy){dx*=0.707;dy*=0.707;}
  }
  tryMoveLocal(me,dx,dy);

  if(myMode==='soccer'&&ball){me.angle=Math.atan2(ball.y-me.y,ball.x-me.x);}
  else{let minD=Infinity;Object.values(players).forEach(p=>{if(p.id!==myId&&!p.dead&&p.team!==myTeam){const d=Math.hypot(p.x-me.x,p.y-me.y);if(d<minD){minD=d;me.angle=Math.atan2(p.y-me.y,p.x-me.x);}}});}

  if(reloadTimer>0){reloadTimer--;if(reloadTimer<=0)ammo=5;}
  if(shootCooldown>0)shootCooldown--;
  if(kickCooldown>0)kickCooldown--;

  const fire=keys['c']||keys['ç']||fireBtnDown||kickBtnDown;
  if(fire){
    if(myMode==='soccer'&&ball&&kickCooldown===0){
      const dist=Math.hypot(ball.x-me.x,ball.y-me.y);
      if(dist<me.r+ball.r+16){
        const a=Math.atan2(ball.y-me.y,ball.x-me.x);
        const vx=Math.cos(a)*10.5,vy=Math.sin(a)*10.5;
        socket.emit('ballKick',{vx,vy});
        ball.vx=vx;ball.vy=vy;
        kickCooldown=20;spawnParts(ball.x,ball.y,'#fff',5,3);
      }
    }
    if(shootCooldown===0&&reloadTimer===0&&ammo>0){
      const a=me.angle+(Math.random()-0.5)*0.1;
      const bData={x:me.x+Math.cos(a)*(me.r+2),y:me.y+Math.sin(a)*(me.r+2),vx:Math.cos(a)*7.5,vy:Math.sin(a)*7.5,color:TEAM_COLORS[myTeam],team:myTeam};
      bullets.push({...bData,shooterId:myId,life:70,dead:false,r:5,local:true});
      socket.emit('shoot',bData);
      ammo--;shootCooldown=14;if(ammo<=0)reloadTimer=45;
    }
  }
  socket.emit('playerMove',{x:me.x,y:me.y,angle:me.angle,ammo,reloadTimer});
}

function updateBullets(){
  const walls=myMode==='soccer'?[]:ARENA_WALLS;
  for(let b of bullets){
    if(b.dead)continue;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.x<0||b.x>GW||b.y<0||b.y>GH||b.life<=0){b.dead=true;continue;}
    // Duvar çarpışması — istemci tarafında da
    let hitWall=false;
    for(let w of walls){
      if(b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){hitWall=true;break;}
    }
    if(hitWall){b.dead=true;spawnParts(b.x,b.y,'#888',3,2);continue;}
  }
  bullets=bullets.filter(b=>!b.dead);
}

function updateBallLocal(){
  if(!ball)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  ball.vx*=0.988;ball.vy*=0.988;
  if(Math.abs(ball.vx)<0.04)ball.vx=0;if(Math.abs(ball.vy)<0.04)ball.vy=0;
  if(ball.x-ball.r<=0)ball.vx=Math.abs(ball.vx);
  if(ball.x+ball.r>=GW)ball.vx=-Math.abs(ball.vx);
  if(ball.y-ball.r<=0)ball.vy=Math.abs(ball.vy);
  if(ball.y+ball.r>=GH)ball.vy=-Math.abs(ball.vy);
}

function updateParticles(){for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.88;p.vy*=0.88;p.life--;}particles=particles.filter(p=>p.life>0);}

function drawArenaMap(){
  ctx.fillStyle='#2d3250';ctx.fillRect(0,0,GW,GH);
  for(let x=0;x<15;x++)for(let y=0;y<11;y++)if((x+y)%2===0){ctx.fillStyle='rgba(255,255,255,0.025)';ctx.fillRect(x*40,y*40,40,40);}
  ARENA_WALLS.forEach(w=>{ctx.fillStyle='#4a5180';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle='#5c6499';ctx.fillRect(w.x,w.y,w.w,4);ctx.fillRect(w.x,w.y,4,w.h);});
}
function drawSoccerMap(){
  for(let x=0;x<8;x++){ctx.fillStyle=x%2===0?'#2d5a27':'#335f2c';ctx.fillRect(x*(GW/8),0,GW/8,GH);}
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
  ctx.strokeRect(2,2,GW-4,GH-4);ctx.beginPath();ctx.moveTo(GW/2,2);ctx.lineTo(GW/2,GH-2);ctx.stroke();
  ctx.beginPath();ctx.arc(GW/2,GH/2,55,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(231,76,60,0.3)';ctx.fillRect(0,GOAL_TOP,GOAL_W,GOAL_H);
  ctx.fillStyle='rgba(91,142,245,0.3)';ctx.fillRect(GW-GOAL_W,GOAL_TOP,GOAL_W,GOAL_H);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(0,GOAL_TOP,GOAL_W,GOAL_H);ctx.strokeRect(GW-GOAL_W,GOAL_TOP,GOAL_W,GOAL_H);
}
function drawBall(){
  if(!ball)return;
  ctx.save();ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(ball.x-3,ball.y-3,4,0,Math.PI*2);ctx.fillStyle='#333';ctx.fill();ctx.restore();
}
function drawPlayers(){
  Object.values(players).forEach(p=>{
    if(p.dead)return;
    const isMe=p.id===myId,color=TEAM_COLORS[p.team]||'#fff';
    // Vurulunca kırmızı flash — görünmez OLMA, sadece renk değiştir
    if(p.hitFlash>0)p.hitFlash--;
    const drawColor=p.hitFlash>0?'#fff':color;
    ctx.save();ctx.translate(p.x,p.y);
    ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fillStyle=drawColor;ctx.fill();
    if(isMe){ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2.5;ctx.stroke();}
    // Can barı
    const pct=Math.max(0,(p.hp||100)/100);
    ctx.fillStyle='#222';ctx.fillRect(-13,-22,26,4);
    ctx.fillStyle=pct>0.5?'#4caf50':pct>0.25?'#f5a623':'#e74c3c';
    ctx.fillRect(-13,-22,26*pct,4);
    ctx.save();ctx.rotate(p.angle||0);ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(7,-3,12,6,3);ctx.fill();ctx.restore();
    ctx.font='9px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText((p.label||'?')+(isMe?' ◀':''),0,-26);
    ctx.restore();
  });
}
function drawBullets(){
  for(let b of bullets){
    ctx.save();ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fillStyle=b.color||'#fff';ctx.fill();ctx.restore();
  }
}
function drawParticles(){for(let p of particles){ctx.save();ctx.globalAlpha=p.life/p.maxLife;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.restore();}}
function drawGoalFlash(){
  if(goalFlash<=0)return;
  ctx.save();ctx.globalAlpha=Math.min(goalFlash/50,0.6);ctx.fillStyle='#000';ctx.fillRect(0,0,GW,GH);
  ctx.globalAlpha=Math.min(goalFlash/40,1);ctx.font='bold 46px Arial';ctx.fillStyle='#f5a623';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(goalText,GW/2,GH/2);ctx.restore();goalFlash--;
}
function updateHUD(){
  function rb(id,team){
    const el=document.getElementById(id);el.innerHTML='';
    Object.values(players).filter(p=>p.team===team).forEach(p=>{
      const row=document.createElement('div');row.className='mbar-row';
      const lbl=document.createElement('span');lbl.textContent=p.id===myId?'👤':'👥';lbl.style.width='16px';
      const bg=document.createElement('div');bg.className='bar-bg';
      const fill=document.createElement('div');fill.className='bar-fill';
      const pct=p.dead?0:Math.max(0,(p.hp||100)/100*100);
      fill.style.width=pct+'%';fill.style.background=pct>50?TEAM_COLORS[team]:pct>25?'#f5a623':'#e74c3c';
      bg.appendChild(fill);row.appendChild(lbl);row.appendChild(bg);el.appendChild(row);
    });
  }
  rb('bluebars','blue');rb('redbars','red');
  document.getElementById('scoreboard').innerHTML=myMode==='soccer'?'⚽ '+score.blue+' — '+score.red+' ⚽':'🏆 '+score.blue+' — '+score.red;
}
function gameLoop(){
  updateMyPlayer();
  if(myMode==='soccer')updateBallLocal();
  updateBullets();updateParticles();updateHUD();
  if(myMode==='soccer')drawSoccerMap();else drawArenaMap();
  drawParticles();drawBullets();
  if(myMode==='soccer')drawBall();
  drawPlayers();
  if(myMode==='soccer')drawGoalFlash();
  requestAnimationFrame(gameLoop);
}
function showOverlay(title,desc,isFinal){
  document.getElementById('ovTitle').textContent=title;document.getElementById('ovDesc').textContent=desc;
  const btns=document.getElementById('ovBtns');btns.innerHTML='';
  if(isFinal){const b1=document.createElement('button');b1.className='obtn';b1.textContent='Tekrar Oyna';b1.onclick=()=>location.reload();btns.appendChild(b1);}
  document.getElementById('overlay').style.display='block';
}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
</script>
</body>
